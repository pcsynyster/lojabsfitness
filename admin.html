<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel | BS Fitness</title>
  <meta name="theme-color" content="#db61ac">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>

  <section class="login" id="loginView">
    <form class="login__card" id="loginForm" novalidate>
      <div class="login__brand">
        <img src="assets/img/logo-branca.png" alt="BS Fitness Moda fitness">
      </div>
      <div class="login__body">
        <h1>Painel da loja</h1>
        <p>Entre para cadastrar e editar seus produtos.</p>
        <label class="field">
          <span>Usuário</span>
          <input type="text" id="loginUser" autocomplete="username" autocapitalize="none" required>
        </label>
        <label class="field">
          <span>Senha</span>
          <div class="field__pass">
            <input type="password" id="loginPass" autocomplete="current-password" required>
            <button type="button" class="eye" data-eye="loginPass" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>
        <p class="login__error" id="loginError" role="alert"></p>
        <button type="submit" class="btn btn--solid btn--block" id="loginBtn">Entrar</button>
        <a href="index.html" class="login__back">Voltar para o site</a>
      </div>
    </form>
  </section>

  <section class="app" id="appView" hidden>
    <header class="topbar">
      <img src="assets/img/logo-branca.png" alt="BS Fitness" class="topbar__logo">
      <div class="topbar__actions">
        <a href="index.html" target="_blank" rel="noopener" class="topbar__link">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span>Ver site</span>
        </a>
        <button class="topbar__link" id="passOpen">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span>Senha</span>
        </button>
        <button class="topbar__link" id="logout">
          <svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="main__head">
        <div>
          <p class="eyebrow">Catálogo</p>
          <h1>Seus produtos</h1>
          <p class="muted" id="summary">Carregando...</p>
        </div>
        <button class="btn btn--solid" id="newProduct">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Novo produto
        </button>
      </div>

      <div class="list" id="list"></div>
    </main>
  </section>

  <div class="overlay" id="overlay"></div>

  <aside class="editor" id="editor" aria-hidden="true">
    <form id="productForm" novalidate>
      <div class="editor__head">
        <h2 id="editorTitle">Novo produto</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="editor__body">
        <label class="field">
          <span>Nome do produto</span>
          <input type="text" id="fName" maxlength="120" placeholder="Ex.: Conjunto Evolution" required>
        </label>

        <div class="row">
          <label class="field">
            <span>Preço (R$)</span>
            <input type="text" id="fPrice" inputmode="decimal" placeholder="136,00" required>
          </label>
          <label class="field">
            <span>Etiqueta (opcional)</span>
            <input type="text" id="fTag" maxlength="30" placeholder="Ex.: Lançamento">
          </label>
        </div>

        <label class="field">
          <span>Descrição</span>
          <textarea id="fDesc" rows="3" maxlength="400" placeholder="Fale do tecido, do caimento, dos detalhes..."></textarea>
        </label>

        <label class="switch">
          <input type="checkbox" id="fActive" checked>
          <span class="switch__track"></span>
          <span>Mostrar no site</span>
        </label>

        <div class="variants">
          <div class="variants__head">
            <h3>Cores, fotos e tamanhos</h3>
            <button type="button" class="btn btn--line btn--small" id="addVariant">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              Adicionar cor
            </button>
          </div>
          <div id="variantList"></div>
        </div>
      </div>

      <div class="editor__foot">
        <p class="form-error" id="formError" role="alert"></p>
        <button type="button" class="btn btn--line" data-close>Cancelar</button>
        <button type="submit" class="btn btn--solid" id="saveBtn">Salvar produto</button>
      </div>
    </form>
  </aside>

  <div class="modal" id="confirmModal" aria-hidden="true">
    <div class="modal__card">
      <h3 id="confirmTitle">Excluir produto?</h3>
      <p id="confirmText">Essa ação não pode ser desfeita.</p>
      <div class="modal__actions">
        <button class="btn btn--line" id="confirmNo">Cancelar</button>
        <button class="btn btn--danger" id="confirmYes">Excluir</button>
      </div>
    </div>
  </div>

  <div class="modal" id="passModal" aria-hidden="true">
    <form class="modal__card" id="passForm" novalidate>
      <h3>Trocar senha</h3>
      <p>Use pelo menos 8 caracteres.</p>
      <label class="field">
        <span>Nova senha</span>
        <input type="password" id="newPass" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field">
        <span>Repita a nova senha</span>
        <input type="password" id="newPass2" autocomplete="new-password" minlength="8" required>
      </label>
      <p class="form-error" id="passError" role="alert"></p>
      <div class="modal__actions">
        <button type="button" class="btn btn--line" id="passCancel">Cancelar</button>
        <button type="submit" class="btn btn--solid" id="passSave">Salvar senha</button>
      </div>
    </form>
  </div>

  <template id="variantTpl">
    <div class="variant">
      <div class="variant__photo">
        <img alt="" hidden>
        <label class="upload">
          <input type="file" accept="image/jpeg,image/png,image/webp">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>
          <span>Escolher foto</span>
        </label>
        <div class="variant__progress" hidden><span></span></div>
      </div>
      <div class="variant__fields">
        <label class="field">
          <span>Nome da cor</span>
          <input type="text" class="v-color" maxlength="40" placeholder="Ex.: Vermelho">
        </label>
        <div class="swatches">
          <label class="swatch-pick">
            <input type="color" class="v-hex" value="#db61ac">
            <span>Cor</span>
          </label>
          <label class="check">
            <input type="checkbox" class="v-two">
            <span>Duas cores</span>
          </label>
          <label class="swatch-pick v-hex2-wrap" hidden>
            <input type="color" class="v-hex2" value="#ffffff">
            <span>2ª cor</span>
          </label>
          <span class="swatch-preview"></span>
        </div>
        <div class="sizes-pick">
          <span>Tamanhos disponíveis</span>
          <div>
            <label class="size-check"><input type="checkbox" value="P"><span>P</span></label>
            <label class="size-check"><input type="checkbox" value="M"><span>M</span></label>
            <label class="size-check"><input type="checkbox" value="G"><span>G</span></label>
            <label class="size-check"><input type="checkbox" value="GG"><span>GG</span></label>
          </div>
        </div>
      </div>
      <button type="button" class="icon-btn variant__remove" aria-label="Remover cor">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
